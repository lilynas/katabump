name: Katabump Auto Renew

on:
  schedule:
  # 每天 UTC 0点 (北京时间 8点) 运行
  - cron: '0 0 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install System & Python Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
        pip install seleniumbase requests
        seleniumbase install chromedriver

    - name: Start Proxy (sing-box)
      env:
        PROXY_URL: ${{ secrets.PROXY_URL }}
      run: |
        if [ -z "$PROXY_URL" ]; then
          echo "PROXY_URL not set, skipping sing-box setup."
          exit 0
        fi
        SINGBOX_VER="1.13.16"
        echo "Downloading sing-box v${SINGBOX_VER}..."
        wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
        tar -xzf "sing-box-${SINGBOX_VER}-linux-amd64.tar.gz"
        mv "sing-box-${SINGBOX_VER}-linux-amd64/sing-box" ./sing-box
        chmod +x ./sing-box
        echo "Generating sing-box config from PROXY_URL..."
        python proxy_handler.py
        echo "Starting sing-box..."
        nohup ./sing-box run -c config.json > singbox.log 2>&1 &
        # urltest group needs time to probe all pool nodes before first use
        for i in $(seq 1 12); do
          sleep 2
          if [ "$i" -eq 12 ]; then
            echo "waited 24s for urltest to settle"
          fi
        done
        echo "--- singbox.log ---"
        cat singbox.log || true
        echo "--- health check ---"
        if ! pgrep -f "./sing-box" > /dev/null; then
          echo "❌ sing-box process not running"
          exit 1
        fi
        echo "✅ sing-box process alive"
        (command -v ss >/dev/null && ss -tlnp 2>/dev/null | grep 8080) || echo "(ss unavailable)"
        echo "--- proxy connectivity test ---"
        if ! curl -s -m 30 -x http://127.0.0.1:8080 https://api.ip.sb/ip; then
          echo ""
          echo "❌ proxy connect FAILED — no reachable anytls node in pool"
          echo "   The sing-box process is alive but every PROXY_URL/pool node timed out."
          echo "   Could be cap on the airline nodes, the GH runner egress block, or a bad PROXY_URL."
          echo "   Check the run's singbox.log artifact for which node the urltest picked."
          exit 1
        else
          echo ""
          echo "  <- proxy OK"
          # show which node the urltest group selected (sing-box debug line)
          grep -iE "urltest|selected|node-" singbox.log | tail -5 || true
        fi

    - name: Run Renew Script
      env:
        USERS_JSON: ${{ secrets.USERS_JSON }}
        PROXY_URL: ${{ secrets.PROXY_URL }}
        PROXY_SERVER: http://127.0.0.1:8080
        IS_PROXY: "true"
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: |
          *.png
          screenshots/
          singbox.log
        if-no-files-found: ignore
